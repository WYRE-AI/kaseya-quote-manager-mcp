
services:
  # Gateway mode. The Quote Manager API key arrives per request on
  # x-kaseya-quote-manager-api-key. Do not set KASEYA_QUOTE_MANAGER_API_KEY
  # or env_file here — that would put a static vendor credential in the
  # container. The project .env is used only for Compose interpolation.
  # For AUTH_MODE=env, pass KASEYA_QUOTE_MANAGER_API_KEY on that process
  # instead (see the README).
  kaseya-quote-manager-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: kaseya-quote-manager-mcp:latest
    container_name: kaseya-quote-manager-mcp-server
    restart: unless-stopped
    environment:
      - MCP_SERVER_NAME=${MCP_SERVER_NAME:-kaseya-quote-manager-mcp}
      - MCP_SERVER_VERSION=${MCP_SERVER_VERSION:-1.0.0}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=production
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      - AUTH_MODE=gateway
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Mount logs directory for persistence
      - kaseya-quote-manager-mcp-logs:/app/logs
    
    # Health check
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Resource limits for production use
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # Development service
  kaseya-quote-manager-mcp-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: kaseya-quote-manager-mcp:dev
    container_name: kaseya-quote-manager-mcp-dev
    working_dir: /app
    restart: "no"
    command: npm run dev
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - KASEYA_QUOTE_MANAGER_API_KEY=${KASEYA_QUOTE_MANAGER_API_KEY}
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
      - kaseya-quote-manager-mcp-dev-logs:/app/logs
    stdin_open: true
    tty: true

volumes:
  kaseya-quote-manager-mcp-logs:
    driver: local
  kaseya-quote-manager-mcp-dev-logs:
    driver: local
